function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.customers&&d.projects&&d.docs){d.docs.forEach(x=>{if(x.type==='AB')x.type='C';if(x.type==='LS')x.type='D'});return d}}catch(e){}return {customers:[],projects:[],docs:[],sequences:{},settings:{company:'Die Lichtgestalter · Gesellschaft für Licht + Raum mbH',address:'Adam-Höfle-Weg 11\n64673 Zwingenberg',email:'contact@dielichtgestalter.de',bank:'FYRST · IBAN DE73 5007 0371 0052 9909 00',footer:'Es gelten unsere Allgemeinen Geschäftsbedingungen.',vat:19}}}function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){alert('Speicherung fehlgeschlagen. Bitte Backup exportieren.')}}function id(){return 'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,8)}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function eur(n){return Number(n||0).toLocaleString('de-DE',{style:'currency',currency:'EUR'})}function today(){return new Date().toISOString().slice(0,10)}function cust(id){return state.customers.find(x=>x.id===id)}function proj(id){return state.projects.find(x=>x.id===id)}function doc(id){return state.docs.find(x=>x.id===id)}function total(lines){return (lines||[]).reduce((a,x)=>a+Number(x.qty||0)*Number(x.price||0)*Number(x.percent??100)/100,0)}function amount(d){return total(d.lines)}function nextNum(type,date){const year=String(date||today()).slice(0,4),month=String(date||today()).slice(5,7);const key=type+'_'+year;const existing=state.docs.filter(d=>d.type===type&&String(d.date||'').slice(0,4)===year).map(d=>{let m=String(d.number||'').match(/^[A-Z]_(\d{4})\.(\d{2})\.(\d+)/);return m?Number(m[3]):0});const n=Math.max(Number(state.sequences[key]||0),...existing,0)+1;state.sequences[key]=n;return type+'_'+year+'.'+month+'.'+String(n).padStart(2,'0')}
function customerDocs(customerId,excludedId){return state.docs.filter(d=>customerId&&d.customerId===customerId&&d.id!==excludedId&&d.status!=='Storniert')}
function refreshSourceOptions(){let el=document.getElementById('d_source');if(!el)return;let selected=el.value, cid=val('d_customer');el.innerHTML='<option value="">Dokument auswählen</option>'+customerDocs(cid,editing.id).map(d=>'<option value="'+esc(d.id)+'">'+esc(d.number)+' · '+esc(types[d.type])+'</option>').join('');if(customerDocs(cid,editing.id).some(d=>d.id===selected))el.value=selected;else if(editing.sourceId&&customerDocs(cid,editing.id).some(d=>d.id===editing.sourceId))el.value=editing.sourceId;refreshDeductionOptions()}

function resolvedDeductions(ids,seen=new Set()){for(const x of ids||[]){const d=doc(x);if(!d||seen.has(x))continue;seen.add(x);resolvedDeductions(d.deductionIds||[],seen)}return [...seen]}
function invoiceDue(d){let v=deductionTotals(d.deductionIds||[]);return Math.round((amount(d)*(1+Number(d.vat??19)/100)-v.net-v.tax)*100)/100}

function nav(){const n=document.getElementById("nav");n.innerHTML=["Pipeline","Projekte","Kunden",...Object.values(types),"Einstellungen"].map((x,i)=>`<button type="button" data-tab="${i}" class="${view===x?"active":""}">${x}</button>`).join("");n.querySelectorAll("button[data-tab]").forEach((b,i)=>b.addEventListener("click",()=>{view=["Pipeline","Projekte","Kunden",...Object.values(types),"Einstellungen"][i];render()}))}function render(){nav();let a=document.getElementById('app');if(view==='Pipeline')a.innerHTML=pipeline();else if(view==='Projekte')a.innerHTML=projectsPage();else if(view==='Kunden')a.innerHTML=customersPage();else if(view==='Einstellungen')a.innerHTML=settingsPage();else a.innerHTML=docsPage(Object.keys(types).find(k=>types[k]===view));}
function pipeline(){let open=state.docs.filter(d=>d.type==='I'&&d.status!=='Bezahlt');return `<div class="toolbar"><div><h2>Projektpipeline</h2><div class="muted">Projekte zwischen den Phasen ziehen</div></div><div class="actions"><button onclick="projectForm()">+ Neues Projekt</button></div></div><div class="stats"><div class="stat">Projekte<b>${state.projects.length}</b></div><div class="stat">Angebotsvolumen netto<b>${eur(state.docs.filter(d=>d.type==='Q').reduce((s,d)=>s+amount(d),0))}</b></div><div class="stat">Offene Rechnungen<b>${open.length}</b></div><div class="stat">Offener Rechnungsbetrag brutto<b>${eur(open.reduce((s,d)=>s+amount(d)*(1+Number(d.vat??19)/100),0))}</b></div></div><div class="board">${phases.map(ph=>`<div class="lane" ondragover="event.preventDefault();this.classList.add('over')" ondragleave="this.classList.remove('over')" ondrop="dropProject(event,${JSON.stringify(ph)});this.classList.remove('over')"><h3>${ph}<span class="count">${state.projects.filter(p=>p.phase===ph).length}</span></h3>${state.projects.filter(p=>p.phase===ph).map(p=>`<div class="project-card" draggable="true" ondragstart="startDrag(event,'${p.id}')" ondragend="endDrag()" onclick="projectDetail('${p.id}')"><strong>${esc(p.name)}</strong><p>${esc(cust(p.customerId)?.name||'Ohne Kunden')}</p><p>${esc(p.number||'')}</p><span class="sum">${state.docs.filter(d=>d.projectId===p.id&&d.type==='Q').length} Angebot(e)</span><select class="phase-picker" aria-label="Projektphase ändern" onclick="event.stopPropagation()" onchange="event.stopPropagation();moveProject('${p.id}',this.value)">${phases.map(x=>`<option value="${x}" ${p.phase===x?'selected':''}>${x}</option>`).join('')}</select></div>`).join('')}</div>`).join('')}</div>`}let draggedProjectId='';function startDrag(e,pid){draggedProjectId=pid;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',pid)}function endDrag(){draggedProjectId='';document.querySelectorAll('.lane').forEach(x=>x.classList.remove('over function projectsPage(){return `<div class="toolbar"><h2>Projekte</h2><button onclick="projectForm()">+ Neues Projekt</button></div><div class="panel tablewrap"><table><thead><tr><th>Projektnummer</th><th>Projekt</th><th>Kunde</th><th>Phase</th><th>Dokumente</th><th></th></tr></thead><tbody>${state.projects.map(p=>`<tr class="clickable" onclick="projectDetail('${p.id}')"><td>${esc(p.number)}</td><td><b>${esc(p.name)}</b></td><td>${esc(cust(p.customerId)?.name)}</td><td><span class="pill">${esc(p.phase)}</span></td><td>${state.docs.filter(d=>d.projectId===p.id).length}</td><td>Öffnen →</td></tr>`).join('')}</tbody></table>${state.projects.length?'':'<div class="empty">Noch keine Projekte angelegt</div>'}</div>`}
function customersPage(){return `<div class="toolbar"><h2>Kunden</h2><button onclick="customerForm()">+ Neuer Kunde</button></div><div class="panel tablewrap"><table><thead><tr><th>Name / Firma</th><th>E-Mail</th><th>Telefon</th><th>Adresse</th><th></th></tr></thead><tbody>${state.customers.map(c=>`<tr><td><b>${esc(c.name)}</b></td><td>${esc(c.email)}</td><td>${esc(c.phone)}</td><td>${esc(c.address)}</td><td><button class="secondary" onclick="customerForm('${c.id}')">Bearbeiten</button></td></tr>`).join('')}</tbody></table>${state.customers.length?'':'<div class="empty">Noch keine Kunden angelegt</div>'}</div>`}
function docsPage(type){let ds=state.docs.filter(d=>d.type===type).sort((a,b)=>(b.date||'').localeCompare(a.date||''));return `<div class="toolbar"><h2>${types[type]}</h2><button onclick="documentForm(null,'${type}')">+ ${type==='I'?'Neue Rechnung':'Neues Dokument'}</button></div><div class="panel tablewrap"><table><thead><tr><th>Nummer</th><th>Datum</th><th>Kunde</th><th>Projekt</th><th>Netto</th><th>Brutto</th><th>Status</th><th>Aktionen</th></tr></thead><tbody>${ds.map(d=>`<tr><td><b>${esc(d.number)}</b></td><td>${esc(d.date)}</td><td>${esc(cust(d.customerId)?.name)}</td><td>${esc(proj(d.projectId)?.name)}</td><td>${eur(amount(d))}</td><td>${eur(amount(d)*(1+Number(d.vat??19)/100))}</td><td><span class="pill ${d.status==='Bezahlt'||d.status==='Bestätigt'?'green':d.status==='Offen'||d.status==='Überfällig'?'red':'orange'}">${esc(d.status)}</span></td><td><button class="link" onclick="documentForm('${d.id}')">Öffnen</button><button class="link" onclick="downloadDoc('${d.id}')">PDF herunterladen</button><button class="link" style="color:#b42332" onclick="deleteDocument('${d.id}')">Löschen</button></td></tr>`).join('')}</tbody></table>${ds.length?'':'<div class="empty">Noch keine Dokumente vorhanden</div>'}</div>`}
function modal(title,body){document.getElementById('overlay').innerHTML=`<div class="modal-back" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-head"><h2>${title}</h2><button class="secondary" onclick="closeModal()">✕</button></div>${body}</div></div>`}function closeModal(){document.getElementById('overlay').innerHTML=''}function val(id){return document.getElementById(id)?.value||''}function field(label,id,value='',kind='text'){return `<div class="field"><label for="${id}">${label}</label><input id="${id}" type="${kind}" value="${esc(value)}"></div>`}function area(label,id,value=''){return `<div class="field"><label for="${id}">${label}</label><textarea id="${id}">${esc(value)}</textarea></div>`}function selectField(label,id,options,value){return `<div class="field"><label>${label}</label><select id="${id}">${options.map(o=>`<option value="${esc(o.value)}" ${o.value===value?'selected':''}>${esc(o.label)}</option>`).join('')}</select></div>`}
function customerForm(cid){let c=cust(cid)||{};modal(cid?'Kunde bearbeiten':'Kunde anlegen',`<div class="grid2">${field('Firma / Name','c_name',c.name)}${field('Ansprechpartner','c_contact',c.contact)}${field('E-Mail','c_email',c.email,'email')}${field('Telefon','c_phone',c.phone)}</div>${area('Rechnungsadresse','c_address',c.address)}${area('Lieferadresse (optional)','c_delivery',c.delivery)}<div class="foot">${cid?`<button class="danger" onclick="deleteCustomer('${cid}')">Löschen</button>`:''}<button class="secondary" onclick="closeModal()">Abbrechen</button><button onclick="saveCustomer('${cid||''}')">Speichern</button></div>`)}function saveCustomer(cid){if(!val('c_name').trim())return alert('Name eingeben');let c=cust(cid);if(!c){c={id:id()};state.customers.push(c)}Object.assign(c,{name:val('c_name'),contact:val('c_contact'),email:val('c_email'),phone:val('c_phone'),address:val('c_address'),delivery:val('c_delivery')});save();closeModal();render()}function deleteCustomer(cid){if(state.projects.some(p=>p.customerId===cid)||state.docs.some(d=>d.customerId===cid))return alert('Kunde ist in Projekten oder Dokumenten in Verwendung.');if(confirm('Kunden wirklich löschen?')){state.customers=state.customers.filter(c=>c.id!==cid);save();closeModal();render()}}
function projectForm(pid){let p=proj(pid)||{};modal(pid?'Projekt bearbeiten':'Projekt anlegen',`<div class="grid2">${field('Projektname','p_name',p.name)}${field('Projektnummer (frei)','p_number',p.number||'')}${selectField('Kunde','p_customer',[{value:'',label:'Bitte wählen'},...state.customers.map(c=>({value:c.id,label:c.name}))],p.customerId||'')}${selectField('Phase','p_phase',phases.map(x=>({value:x,label:x})),p.phase||phases[0])}</div>${area('Notizen','p_notes',p.notes)}<div class="foot">${pid?`<button class="danger" onclick="deleteProject('${pid}')">Projekt löschen</button>`:''}<button class="secondary" onclick="closeModal()">Abbrechen</button><button onclick="saveProject('${pid||''}')">Speichern</button></div>`)}function saveProject(pid){if(!val('p_name').trim())return alert('Projektname eingeben');let p=proj(pid);if(!p){p={id:id()};state.projects.push(p)}Object.assign(p,{name:val('p_name'),number:val('p_number'),customerId:val('p_customer'),phase:val('p_phase'),notes:val('p_notes')});save();closeModal();render()}function deleteProject(pid){if(state.docs.some(d=>d.projectId===pid))return alert('Projekt enthält Dokumente und kann nicht gelöscht werden.');if(confirm('Projekt löschen?')){state.projects=state.projects.filter(p=>p.id!==pid);save();closeModal();render()}}
function projectDetail(pid){let p=proj(pid);if(!p)return;let ds=state.docs.filter(d=>d.projectId===pid);modal('Projekt · '+esc(p.name),`<div class="grid3"><div><label>Projekt</label><b>${esc(p.number)}</b></div><div><label>Kunde</label><b>${esc(cust(p.customerId)?.name)}</b></div><div><label>Phase</label><b>${esc(p.phase)}</b></div></div><p>${esc(p.notes||'')}</p><div class="actions" style="margin:20px 0"><button class="secondary" onclick="projectForm('${pid}')">Projekt bearbeiten</button><button onclick="documentForm(null,'Q','${pid}')">+ Angebot</button><button onclick="documentForm(null,'C','${pid}')">+ AB</button><button onclick="documentForm(null,'I','${pid}')">+ Rechnung</button><button onclick="documentForm(null,'D','${pid}')">+ Lieferschein</button></div><div class="tablewrap"><table><tr><th>Typ</th><th>Nummer</th><th>Datum</th><th>Netto</th><th>Status</th><th></th></tr>${ds.map(d=>`<tr><td>${types[d.type]}</td><td>${esc(d.number)}</td><td>${esc(d.date)}</td><td>${eur(amount(d))}</td><td>${esc(d.status)}</td><td><button class="link" onclick="documentForm('${d.id}')">Öffnen</button></td></tr>`).join('')}</table></div><div class="foot"><button onclick="closeModal()">Schließen</button></div>`)}
function sourceOptions(pid){return state.docs.filter(d=>!pid||d.projectId===pid).map(d=>({value:d.id,label:d.number+' · '+types[d.type]}))}function documentForm(did,type='Q',pid=''){let d=doc(did)||{id:'',type,projectId:pid,customerId:proj(pid)?.customerId||'',date:today(),status:type==='I'?'Offen':type==='C'?'Offen':'Entwurf',vat:state.settings.vat,lines:[{id:id(),sku:'',description:'',qty:1,price:0,percent:100,sourceLineId:''}],notes:'',introText:'',outroText:'',serviceDate:'',payment:'Zahlbar sofort ohne Abzug',sourceId:'',deductionIds:[]};editing=JSON.parse(JSON.stringify(d));modal(did?types[d.type]+' · '+esc(d.number):'Neues Dokument · '+types[d.type],`<div class="notice">Dokumente können aus einem bestehenden Angebot übernommen werden. Bei Rechnungen lässt sich jede Position unabhängig prozentual abrechnen. Vor produktiver Nutzung müssen Restbeträge und steuerliche Anforderungen zusätzlich geprüft werden.</div><div class="grid3">${selectField('Dokumenttyp','d_type',Object.keys(types).map(x=>({value:x,label:types[x]})),d.type)}${selectField('Projekt','d_project',[{value:'',label:'Ohne Projekt'},...state.projects.map(p=>({value:p.id,label:p.name}))],d.projectId)}${selectField('Kunde','d_customer',[{value:'',label:'Bitte wählen'},...state.customers.map(c=>({value:c.id,label:c.name}))],d.customerId)}<div class="field"><label>Neuer Kunde</label><button type="button" class="secondary" onclick="toggleInlineCustomer()">+ Direkt anlegen</button></div>${field('Datum','d_date',d.date,'date')}${selectField('Status','d_status',[...new Set(['Entwurf','Offen','Bestätigt','Teilweise bezahlt','Bezahlt','Storniert','Versendet','Geliefert'])].map(x=>({value:x,label:x})),d.status)}${field('MwSt. %','d_vat',d.vat,'number')}</div><div id="inlineCustomer" class="panel" style="display:none;background:#f8fafc"><h3>Neuen Kunden direkt anlegen</h3><div class="grid2">${field('Firma / Name','ic_name')}${field('Ansprechpartner','ic_contact')}${field('E-Mail','ic_email')}${field('Telefon',' tton><button onclick="saveDocument()">${did?'Änderungen speichern':'Dokument anlegen'}</button></div>` );drawLines();document.getElementById('d_customer').addEventListener('change',refreshSourceOptions);document.getElementById('d_project').addEventListener('change',projectCustomerSync);refreshSourceOptions()}
function toggleInlineCustomer(){let e=document.getElementById('inlineCustomer');e.style.display=e.style.display==='none'?'block':'none'}function saveInlineCustomer(){let name=val('ic_name').trim();if(!name)return alert('Bitte Kundennamen eingeben.');let c={id:id(),name,contact:val('ic_contact'),email:val('ic_email'),phone:val('ic_phone'),address:val('ic_address'),delivery:val('ic_delivery')};state.customers.push(c);save();let sel=document.getElementById('d_customer');sel.add(new Option(c.name,c.id));sel.value=c.id;refreshSourceOptions();document.getElementById('inlineCustomer').style.display='none';alert('Kunde angelegt und ausgewählt.')}
function drawLines(){let t=document.getElementById('lines');if(!t)return;t.innerHTML=editing.lines.map((l,i)=>`<tr><td><input class="short" value="${esc(l.sku)}" oninput="editLine(${i},'sku',this.value)"></td><td><textarea class="description" oninput="editLine(${i},'description',this.value)">${esc(l.description)}</textarea></td><td><input class="short" type="number" step="0.01" value="${l.qty}" oninput="editLine(${i},'qty',this.value)"></td><td><input type="number" step="0.01" value="${l.price}" oninput="editLine(${i},'price',this.value)"></td><td><input class="short" type="number" min="0" max="100" step="0.01" value="${l.percent}" oninput="editLine(${i},'percent',this.value)"></td><td class="right" id="lineSum${i}">${eur(Number(l.qty)*Number(l.price)*Number(l.percent)/100)}</td><td><button class="danger" onclick="removeLine(${i})">✕</button></td></tr>`).join('');updateSum()}function editLine(i,k,v){editing.lines[i][k]=v;let cell=document.getElementById('lineSum'+i);if(cell)cell.textContent=eur(Number(editing.lines[i].qty)*Number(editing.lines[i].price)*Number(editing.lines[i].percent)/100);updateSum()}function updateSum(){let e=document.getElementById('sumDisplay');if(e)e.textContent='Netto '+eur(total(editing.lines))+' · Brutto '+eur(total(editing.lines)*(1+Number(val('d_vat')??19)/100))}function addLine(){editing.lines.push({id:id(),sku:'',description:'',qty:1,price:0,percent:100,sourceLineId:''});drawLines()}function removeLine(i){editing.lines.splice(i,1);drawLines()}function copySource(){let source=doc(val('d_source'));if(!source)return alert('Dokument auswählen');if(source.customerId!==val('d_customer'))return alert('Nur Dokumente desselben Kunden können übernommen werden.');if(editing.lines.some(l=>String(l.description||'').trim())&&!confirm('Vorhandene Positionen und Texte durch das Quelldokument ersetzen?'))return;editing.lines=(source.lines||[]).map(l=>({...l,id:id(),sourceLineId:l.sourceLineId||l.id,percent:100}));editing.sourceId=source.id;editing.introText=source.introText||'';editing.outroText=source.outroText||'';editing.notes=source.notes||'';editing.payment=source.payment||'';editing.serviceDate=source.serviceDate||'';editing.vat=source.vat;document.getElementById('d_project').value=source.projectId||'';document.getElementById('d_customer').value=source.customerId||'';document.getElementById('d_vat').value=source.vat??19;document.getElementById('d_payment').value=editing.payment;document.getElementById('d_service').value=editing.serviceDate;document.getElementById('d_intro').value=editing.introText;document.getElementById('d_outro').value=editing.outroText;document.getElementById('d_notes').value=editing.notes;drawLines();refreshSourceOptions();alert('Positionen, Texte, Kunde, Projekt, MwSt. und Zahlungsbedingungen übernommen. Bezug: '+source.number)}
function acontoDocs(){const pid=val('d_project')||editing.projectId,cid=val('d_customer')||editing.customerId;return state.docs.filter(d=>d.type==='I'&&d.id!==editing.id&&d.customerId===cid&&d.projectId===pid&&d.status!=='Storniert'&&(!editing.date||d.date<=val('d_date'))&&!resolvedDeductions(d.deductionIds||[]).includes(editing.id))}
function refreshDeductionOptions(){let el=document.getElementById('deductionOptions');if(!el)return;let candidates=acontoDocs();el.innerHTML=candidates.length?candidates.map(d=>`<label style="display:flex;align-items:center;gap:9px;margin:10px 0;font-size:13px"><input type="checkbox" style="width:auto" ${editing.deductionIds?.includes(d.id)?'checked':''} onchange="toggleDeduction('${d.id}',this.checked)"> ${esc(d.number)} · ${esc(d.date)} · netto ${eur(amount(d))} · MwSt. ${eur(Math.round(amount(d)*Number(d.vat||0))/100)}</label>`).join(''):'<p class="hint">Für dieses Projekt sind noch keine A-conto-Rechnungen vorhanden.</p>';renderDeductionPreview()}
function toggleDeduction(id,checked){editing.deductionIds=editing.deductionIds||[];editing.deductionIds=checked?[...new Set([...editing.deductionIds,id])]:editing.deductionIds.filter(x=>x!==id);editing.deductionIds=editing.deductionIds.filter(x=>!editing.deductionIds.some(y=>x!==y&&resolvedDeductions([y]).includes(x)));renderDeductionPreview()}
function deductionTotalsDirect(ids){let net=0,tax=0;for(const x of resolvedDeductions(ids)){const d=doc(x);if(!d)continue;const original=amount(d), earlier=resolvedDeductions(d.deductionIds||[]);const priorNet=earlier.reduce((a,z)=>a+Math.max(0,amount(doc(z)||{})),0);const priorTax=earlier.reduce((a,z)=>{const q=doc(z);return a+(q?Math.round(amount(q)*Number(q.vat??0))/100:0)},0);net+=Math.max(0,original-priorNet);tax+=Math.max(0,Math.round(original*Number(d.vat??0))/100-priorTax)}return {net:Math.round(net*100)/100,tax:Math.round(tax*100)/100}}
function deductionTotals(ids){let net=0,tax=0;for(const did of resolvedDeductions(ids)){const d=doc(did);if(!d)continue;const n=amount(d),previous=deductionTotalsDirect(d.deductionIds||[]);net+=Math.max(0,n-previous.net);tax+=Math.max(0,Math.round(n*Number(d.vat??0))/100-previous.tax)}return {net:Math.round(net*100)/100,tax:Math.round(tax*100)/100}}
function renderDeductionPreview(){let el=document.getElementById('deductionPreview');if(!el)return;let v=deductionTotals(editing.deductionIds);el.innerHTML='<b>Anrechnung: '+eur(v.net)+' netto + '+eur(v.tax)+' MwSt. = '+eur(v.net+v.tax)+' brutto</b>'}
function saveDocument(){let type=val('d_type'),projectId=val('d_project'),customerId=val('d_customer');if(!customerId)return alert('Bitte Kunden auswählen.');if(projectId&&proj(projectId)?.customerId!==customerId)return alert('Projekt und Kunde müssen übereinstimmen.');if(editing.sourceId&&doc(editing.sourceId)?.customerId!==customerId)return alert('Quelldokument gehört zu einem anderen Kunden.');if(!editing.lines.length)return alert('Mindestens eine Position hinzufügen.');if(editing.lines.some(l=>Number(l.percent)<0||Number(l.percent)>100||Number(l.qty)<0||Number(l.price)<0))return alert('Ungültige Position: Prozent 0–100, Menge/Preis nicht negativ.');if(type==='I'&&(editing.deductionIds||[]).some(x=>!acontoDocs().some(a=>a.id===x)))return alert('Ungültige A-conto-Auswahl.');let d=editing.id?doc(editing.id):null;if(!d){d={id:id(),number:nextNum(type,val('d_date'))};state.docs.push(d)}else if(d.type!==type){return alert('Dokumenttyp bestehender Dokumente nicht ändern.')}Object.assign(d,{type,projectId,customerId,date:val('d_date'),status:val('d_status'),vat:Number(val('d_vat')||0),serviceDate:val('d_service'),payment:val('d_payment'),notes:val('d_notes'),introText:val('d_intro'),outroText:val('d_outro'),deductionIds:type==='I'?(editing.deductionIds||[]):[],sourceId:editing.sourceId,lines:editing.lines.map(l=>({...l,qty:Number(l.qty),price:Number(l.price),percent:Number(l.percent)}))});save();closeModal();render()}
function deleteDocument(did){
  const d=doc(did);if(!d)return;
  const usedBy=state.docs.filter(x=>x.id!==did&&(x.sourceId===did||(x.deductionIds||[]).includes(did)));
  if(usedBy.length)return alert('Löschen nicht möglich: Dieser Beleg wird von folgenden Dokumenten verwendet: '+usedBy.map(x=>x.number||x.type).join(', ')+'. Bitte zuerst die Verknüpfungen entfernen.');
  // Only unissued drafts can be permanently deleted. Issued invoices require proper cancellation.
  if(d.type==='I'){
    if(d.status!=='Entwurf')return alert('Ausgestellte Rechnungen dürfen nicht endgültig gelöscht werden. Bitte eine ordnungsgemäße Stornierung vornehmen. Nur Rechnungsentwürfe können gelöscht werden.');
    const invoices=state.docs.filter(x=>x.type==='I'&&x.id!==did);
    const numberParts=n=>{const m=String(n||'').match(/^I_(\d{4})\.(\d{2})\.(\d+)$/);return m?[+m[1],+m[2],+m[3]]:null};
    const current=numberParts(d.number);
    if(!current)return alert('Die Rechnungsnummer kann nicht sicher eingeordnet werden. Löschen gesperrt.');
    if(invoices.some(x=>{const n=numberParts(x.number);return !n||n[0]>current[0]||(n[0]===current[0]&&(n[1]>current[1]||(n[1]===current[1]&&n[2]>current[2])))}))return alert('Löschen nicht möglich: Es existiert bereits eine spätere Rechnungsnummer.');
  }
  if(!confirm(types[d.type]+' '+(d.number||'')+' wirklich endgültig löschen?\n\nACHTUNG: Dieser Beleg kann nicht wiederhergestellt werden.'))return;
  state.docs=state.docs.filter(x=>x.id!==did);
  // Never roll back sequence counters; numbers are not reused.
  save();closeModal();render();
}
function printDoc(did){let d=doc(did);if(!d)return;let c=cust(d.customerId)||{},p=proj(d.projectId)||{},s=state.settings,net=amount(d),vat=Number(d.vat??19);let label={Q:'Angebot',C:'Auftragsbestätigung',I:'Rechnung',D:'Lieferschein',G:'Gutschrift'}[d.type]||'Dokument';let date=new Date((d.date||today())+'T12:00:00').toLocaleDateString('de-DE',{weekday:'long',year:'numeric',month:'long',day:'numeric'});let intro={Q:'Wir freuen uns über Ihre Anfrage und bieten Ihnen Folgendes an:',C:'Wir bestätigen Ihren Auftrag wie folgt:',I:'Wir bedanken uns für Ihren Auftrag und stellen vereinbarungsgemäß Folgendes in Rechnung:',D:'Wir liefern Ihnen folgende Positionen:'}[d.type]||'Folgende Positionen:';let rows=d.lines.map((l,i)=>{let sum=Number(l.qty)*Number(l.price)*Number(l.percent??100)/100;return `<tr><td>${i+1}</td><td class="sku">${esc(l.sku)}</td><td class="desc">${esc(l.description).replace(/\n/g,'<br>')}</td><td class="num">${esc(l.qty)}</td><td class="num">${eur(l.price)}</td><td class="num">${eur(sum)}</td></tr>`}).join('');let address=[c.name,c.address].filter(Boolean).join('\n');let footer='Die Lichtgestalter\nGesellschaft für Licht + Raum mbH\n\nAdam-Höfle-Weg 11\n64673 Zwingenberg\nT +49.6251.84808.0\nF +49.6251.8480818\n\ncontact@dielichtgestalter.de\n\nGeschäftsführer:\nChristoph Adlfinger-Pullmann\n\nRegisterblatt HRB 95326\nRegistergericht Darmstadt\nUSt-IdNr. DE305886656';document.getElementById('printarea').innerHTML=`<div class="paper"><img class="doc-logo" src="${new URL('logo.png',document.baseURI).href}" alt="Die Lichtgestalter"><div class="sender">Die Lichtgestalter • Ges. für Licht + Raum mbH - Adam-Höfle-Weg 11 - 64673 Zwingenberg</div><div class="recipient">${esc(address)}</div><div class="doc-date">${esc(date)}</div><div class="doc-title"><div>${label} Nr. ${esc(d.number)}</div><div>Projekt Nr. ${esc(p.number||'')} ${esc(p.name||'')}</div>${d.sourceId?`<div style="font-size:8pt;font-style:normal;font-weight:400">Bezug: ${esc(doc(d.sourceId)?.number||'')}</div>`:''}</div>${d.serviceDate?`<p class="service"><b>Leistungszeitraum / Lieferdatum:</b> ${esc(d.serviceDate)}</p>`:''}<p class="intro">${esc(d.introText||intro).replace(/\n/g,'<br>')}</p><table class="document-table"><colgroup><col style="width:6%"><col style="width:12%"><col style="width:42%"><col style="width:10%"><col style="width:15%"><col style="width:15%"></colgroup><thead><tr><th>Pos.</th><th>Artikelnr.</th><th>Artikel / Dienstleistung</th><th>Anzahl</th><th>Einzelpreis</th><th>Gesamt</th></tr></thead><tbody>${rows}</tbody></table>${d.outroText?`<div class="document-notes" style="margin-top:8mm">${esc(d.outroText).replace(/\n/g,'<br>')}</div>`:''}<div class="totals"><div><span>Summe netto</span><b>${eur(net)}</b></div><div><span>zzgl. MwSt. ${vat}%</span><span>${eur(Math.round(net*vat)/100)}</span></div><div class="grand"><strong>Gesamtbetrag</strong><strong>${eur(net+Math.round(net*vat)/100)}</strong></div>${d.type==='I'&&(d.deductionIds||[]).length?`<div style="margin-top:12px;font-weight:bold">Abzüglich bereits berechneter A-conto-Rechnungen</div>${resolvedDeductions(d.deductionIds).map(x=>{let a=doc(x);if(!a)return '';let prior=deductionTotalsDirect(a.deductionIds||[]),an=Math.max(0,amount(a)-prior.net),at=Math.max(0,Math.round(amount(a)*Number(a.vat??0))/100-prior.tax);return `<div style="display:block;padding:5px 0;border-bottom:1px solid #ddd"><b>${esc(a.number)} vom ${esc(a.date)}</b><div><span>Netto</span><span>− ${eur(an)}</span></div><div><span>MwSt. ${esc(a.vat)} %</span><span>− ${eur(at)}</span></div></div>`}).join('')}<div class="grand"><strong>Verbleibender Rechnungsbetrag</strong><strong>${eur(net+Math.round(net*vat)/100-deductionTotals(d.deductionIds).net-deductionTotals(d.deductionIds).tax)}</strong></div>`:''}</div><div class="document-notes">${esc(d.notes||'').replace(/\n/g,'<br>')}${d.notes?'<p></p>':''}Zahlungsbedingung: ${esc(d.payment||'')}<p>${esc(s.footer||'Es gelten unsere Allgemeinen Geschäftsbedingungen.')}</p></div><aside class="company-side">${esc(footer).replace(/\n/g,'<br>')}</aside><div class="page-number">Seite 1</div></div>`;const logoImage=document.querySelector("#printarea .doc-logo");if(logoImage&&!logoImage.complete){logoImage.onload=()=>window.print();logoImage.onerror=()=>alert("Logo konnte nicht geladen werden. Bitte logo.png im GitHub-Hauptordner prüfen.");}else if(logoImage&&logoImage.naturalWidth===0){alert("Logo konnte nicht geladen werden. Bitte logo.png im GitHub-Hauptordner prüfen.");}else{window.print();}}
function settingsPage(){let s=state.settings;return `<div class="toolbar"><h2>Einstellungen</h2></div><div class="panel"><h3>Absender und Dokumente</h3><div class="grid2">${field('Firmenname','s_company',s.company)}${field('E-Mail','s_email',s.email)}${area('Anschrift','s_address',s.address)}${area('Bankverbindung','s_bank',s.bank)}${field('Standard-MwSt. %','s_vat',s.vat,'number')}${area('Fußzeile / AGB','s_footer',s.footer)}</div><h3>Nummernkreise – zuletzt vergebene Nummer je Kalenderjahr</h3><p class="hint">Trage den letzten bereits vergebenen Zähler ein. Die nächste Nummer ist dieser Wert + 1. Am Jahreswechsel beginnt der neue Zähler bei 01. Bereits vorhandene Dokumente werden nicht umnummeriert.</p><div class="grid2">${field('Kalenderjahr','seq_year',new Date().getFullYear(),'number')}<div class="field"><label>Jahr laden</label><button type="button" class="secondary" onclick="loadSequenceYear()">Nummernkreise anzeigen</button></div>${['Q','C','I','D'].map(t=>field(({Q:'Angebote Q',C:'Auftragsbestätigungen C',I:'Rechnungen I',D:'Lieferscheine D'})[t],'seq_'+t,Number(state.sequences[t+'_'+new Date().getFullYear()]||0),'number')).join('')}</div><button type="button" class="secondary" onclick="saveSequences()">Nummernkreise speichern</button><div style="height:16px"></div><button onclick="saveSettings()">Einstellungen speichern</button></div><div class="notice"><b>Datenspeicherung:</b> Die Daten werden über Supabase synchronisiert. Zusätzlich wird eine lokale Kopie gespeichert. Bitte regelmäßig JSON-Backups exportieren. Gleichzeitige Änderungen können sich derzeit noch überschreiben; Rechnungen sind noch nicht GoBD-konform archiviert.</div>`}function saveSettings(){state.settings={company:val('s_company'),email:val('s_email'),address:val('s_address'),bank:val('s_bank'),vat:Number(val('s_vat')),footer:val('s_footer')};save();alert('Gespeichert');render()}
function loadSequenceYear(){const year=Number(val('seq_year'));if(year<2000||year>2200)return alert('Ungültiges Jahr');for(const t of ['Q','C','I','D'])document.getElementById('seq_'+t).value=Number(state.sequences[t+'_'+year]||0)}
function saveSequences(){const year=Number(val('seq_year'));if(year<2000||year>2200)return alert('Ungültiges Jahr');for(const t of ['Q','C','I','D']){const n=Number(val('seq_'+t));if(!Number.isInteger(n)||n<0)return alert('Zähler müssen ganze Zahlen ab 0 sein');const maxExisting=Math.max(0,...state.docs.filter(d=>d.type===t&&String(d.date||'').startsWith(String(year))).map(d=>{const m=String(d.number||'').match(/^[A-Z]_\d{4}\.\d{2}\.(\d+)/);return m?Number(m[1]):0}));if(n<maxExisting)return alert('Der Zähler für '+t+' darf nicht unter die höchste vorhandene Nummer ('+maxExisting+') gesetzt werden.');state.sequences[t+'_'+year]=n}save();alert('Nummernkreise für '+year+' gespeichert.')}
function exportData(){let blob=new Blob([JSON.stringify({format:'lichtgestalter-v1',exportedAt:new Date().toISOString(),data:state},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='lichtgestalter-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),500)}function importData(ev){let f=ev.target.files?.[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result),d=x.data||x;if(!Array.isArray(d.customers)||!Array.isArray(d.projects)||!Array.isArray(d.docs))throw Error('Ungültiges Format');if(confirm('Alle aktuell gespeicherten Daten durch dieses Backup ersetzen?')){state=d;save();closeModal();render();alert('Backup importiert')}}catch(e){alert('Import fehlgeschlagen: '+e.message)}};r.readAsText(f);ev.target.value=''}render();
